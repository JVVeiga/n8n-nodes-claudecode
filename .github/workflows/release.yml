name: Release

# Manual only. Pushing to main no longer publishes anything.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN is used.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@joaoveiga'

      # setup-node ships an older npm; Trusted Publishing needs a recent CLI.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # semantic-release owns the version, changelog, git tag and GitHub
      # release. It does not publish to npm (npmPublish: false in
      # .releaserc.json), so it needs no NPM_TOKEN — the step below publishes
      # via OIDC instead.
      - name: Version, changelog and GitHub release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(node -p "require('./package.json').version")
          npx semantic-release
          after=$(node -p "require('./package.json').version")
          echo "version=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last release."
          fi

      # Skipped when semantic-release found nothing to release, which would
      # otherwise mean republishing a version that already exists.
      - name: Publish to npm
        if: steps.semantic.outputs.released == 'true'
        run: npm publish

      - name: Summary
        run: |
          if [ "${{ steps.semantic.outputs.released }}" = "true" ]; then
            echo "Published ${{ steps.semantic.outputs.version }} to npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release was due. Nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi
