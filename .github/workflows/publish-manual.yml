name: Publish to npm

# Escape hatch: publishes whatever version you name, bypassing
# semantic-release. The normal path is the Release workflow.
#
# Deliberately not triggered by `release: [published]` — the Release workflow
# creates a GitHub release, which would fire this one and try to republish a
# version that already exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0). Leave empty to publish the version already in package.json.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN is used.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Deliberately no registry-url/scope: setup-node would write an
          # .npmrc pinning _authToken to a placeholder NODE_AUTH_TOKEN, which
          # can shadow the OIDC credential exchange. npmjs.org is the default
          # registry anyway.

      # setup-node ships an older npm; Trusted Publishing needs a recent CLI.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish

      - name: Summary
        run: echo "Published $VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
