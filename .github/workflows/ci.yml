name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run format check
        run: npx prettier --check nodes

  # Add a job to check if the package can be installed
  install-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Derive the tarball name and package name from package.json rather than
      # hard-coding them, so a rename cannot silently break this job again.
      - name: Build package
        run: |
          npm ci
          npm run build
          tarball=$(npm pack --silent)
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - name: Test installation
        run: |
          mkdir test-install
          cd test-install
          npm init -y
          npm install "../$TARBALL"
          # Verify the package was installed
          npm list "$PKG_NAME"